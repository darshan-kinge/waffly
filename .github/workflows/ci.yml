name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build bundles
        run: npm run build

      - name: Audit package exports & types
        run: npm run check:audit

      - name: Run runtime smoke test (Node.js)
        run: node test/runtime-smoke.mjs

      - name: Validate package tarball
        run: npm pack --dry-run

  bun-compatibility:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (for build)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Run smoke test on Bun
        run: bun test/runtime-smoke.mjs

  deno-compatibility:
    name: Test on Deno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (for build)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Run smoke test on Deno
        run: deno run --allow-all test/runtime-smoke.mjs
